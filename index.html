<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}html,body{margin:0}</style></head><body><title>Matcha Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&family=Silkscreen:wght@700&display=swap">
<style>
/* Layout (v5): section tabs, one shelf of nine cups, per-drink colour wash behind the open drink. One shelf of nine cups. Hover spreads the row and enlarges one cup. Click pulls one cup to centre; its layers pull apart with a label for each ingredient. */
:root{
  --bg:#ECEDE8;        /* paper with a green bias */
  --ink:#14170F;
  --muted:#6B7064;
  --line:#CBCEC3;
  --lime:#5DF21C;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@property --wash{syntax:'<color>';inherits:true;initial-value:#ECEDE8}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);
  font-stretch:100%;overflow:hidden;
}
.app{
  height:100%;display:flex;flex-direction:column;--wash:#ECEDE8;transition:--wash .8s ease;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
}
header{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:16px 2px}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .pills{flex:0 0 auto}
.logo{
  background:var(--lime);color:var(--ink);font-family:'Silkscreen','Archivo',monospace;font-weight:700;
  font-size:14px;letter-spacing:.04em;padding:6px 10px 5px;border-radius:5px;text-transform:uppercase;
  transform:rotate(-2deg);
}
.stagewrap{position:relative;flex:1 1 auto;min-height:260px;display:flex}
.wash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 58% 52% at 50% 60%,var(--wash) 0%,transparent 72%)}
.stage{position:relative;z-index:1;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.stage.is-focus{overflow:hidden;touch-action:pan-y}
.track{position:relative;height:100%;min-width:100%}
.shelf{position:absolute;left:0;right:0;height:1px;background:var(--ink);opacity:.55;transition:opacity .5s}
.shelf::after{content:"";position:absolute;left:0;right:0;top:1px;height:26px;background:linear-gradient(var(--line),transparent);opacity:.7}
.group{
  position:absolute;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);transform:translateX(-50%);white-space:nowrap;transition:opacity .4s;
}
.is-focus .shelf,.is-focus .group{opacity:0;pointer-events:none}
.photoview{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20;opacity:0;transition:opacity .45s}
.photoview.on{opacity:1}
.photoview img{position:absolute;display:block}
.pshadow{position:absolute;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,23,15,.3),transparent)}
.explode{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20}
.slice{position:absolute;overflow:hidden;transition:transform .9s cubic-bezier(.2,.8,.2,1);will-change:transform}
.slice img{position:absolute;left:0;display:block;max-width:none;image-rendering:pixelated}
.elabel{
  position:absolute;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  line-height:1.25;padding-left:12px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s;
}
.elabel::before{content:"";position:absolute;left:-34px;top:.55em;width:42px;height:1px;background:var(--ink)}
.elabel::after{content:"";position:absolute;left:-36px;top:calc(.55em - 2px);width:5px;height:5px;border-radius:50%;background:var(--ink)}
@media (max-width:700px){.elabel{font-size:10px;letter-spacing:.06em}}
.cup{
  position:absolute;left:0;top:0;padding:0;border:0;background:none;cursor:pointer;
  transform-origin:50% 100%;
  transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s;
  will-change:transform;-webkit-tap-highlight-color:transparent;
}
.cup img{display:block;width:100%;height:100%;pointer-events:none;user-select:none;image-rendering:pixelated}
.cup .shadow{
  position:absolute;left:8%;right:8%;bottom:-5px;height:10px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(20,23,15,.28),transparent);
}
.cup:focus-visible{outline:2px solid var(--ink);outline-offset:6px;border-radius:6px}

.info{
  flex:0 0 auto;height:236px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;gap:10px;padding-top:8px;
}
.cap-name{font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:.03em;font-size:13px;min-height:16px}
.cap-sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rail-info,.focus-info{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.focus-info{display:none}
.is-focus-mode .rail-info{display:none}
.is-focus-mode .focus-info{display:flex}
.series{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1.title{
  margin:0;font-weight:850;font-stretch:118%;text-transform:uppercase;letter-spacing:.02em;
  font-size:clamp(18px,2.6vw,30px);line-height:1.05;text-wrap:balance;
}
.desc{margin:0;max-width:56ch;font-size:13.5px;line-height:1.45;color:var(--muted);text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:60ch}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink);background:rgba(255,255,255,.55)}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.dot{width:10px;height:10px;padding:0;border:2px solid var(--ink);background:transparent;cursor:pointer;border-radius:0}
.dot[aria-current="true"]{background:var(--ink)}
.dot:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.pills{display:inline-flex;border:1px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.pill{
  font:600 11px/1 var(--display);font-stretch:112%;letter-spacing:.06em;text-transform:uppercase;
  border:0;background:none;color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer;
}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pill:hover{background:rgba(20,23,15,.07)}
.pill[aria-pressed="true"]:hover{background:var(--ink)}
.pill:focus-visible,.nav:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.nav{
  position:absolute;top:50%;z-index:30;transform:translateY(-50%);
  width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:var(--bg);color:var(--ink);
  font-size:18px;cursor:pointer;display:none;
}
.nav.prev{left:8px}.nav.next{right:8px}
.is-focus-mode .nav{display:block}
.back{
  position:absolute;left:8px;top:6px;z-index:30;display:none;
  font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  background:none;border:0;padding:8px 6px;cursor:pointer;
}
.is-focus-mode .back{display:block}
.back:hover{text-decoration:underline}
@media (max-width:700px){
  .info{height:268px}
  .desc{font-size:13px}
  .nav{display:none!important}
}
@media (prefers-reduced-motion:reduce){
  .cup,.shelf,.group{transition:none}
  .slice,.elabel{transition:none!important}
}
</style>

<div class="app" id="app">
  <header>
    <div class="logo">Matcha Menu</div>
    <nav class="tabs" aria-label="Menu sections"><div class="pills" id="tabs"></div></nav>
  </header>
  <div class="stagewrap">
    <div class="wash" aria-hidden="true"></div>
    <main class="stage" id="stage" aria-label="Matcha drinks">
      <div class="track" id="track"></div>
    </main>
    <div class="explode" id="explode" aria-hidden="true"></div>
    <div class="photoview" id="photoView" aria-hidden="true"><span class="pshadow"></span><img id="photoImg" alt=""></div>
    <button class="back" id="back" type="button">&larr; All drinks</button>
    <button class="nav prev" id="prev" type="button" aria-label="Previous drink">&#8249;</button>
    <button class="nav next" id="next" type="button" aria-label="Next drink">&#8250;</button>
  </div>
  <section class="info" id="info" aria-live="polite">
    <div class="rail-info">
      <div class="cap-name" id="capName">9 drinks</div>
      <div class="cap-sub" id="capSub">Hover a cup, click to open</div>
    </div>
    <div class="focus-info">
      <div class="series" id="fSeries"></div>
      <h1 class="title" id="fTitle"></h1>
      <p class="desc" id="fDesc"></p>
      <div class="chips" id="fChips" aria-label="Ingredients"></div>
      <div class="row">
        <div class="pills" role="group" aria-label="View" id="pills"></div>
      </div>
      <div class="dots" id="dots" role="group" aria-label="Choose a drink"></div>
    </div>
  </section>
</div>

  var photoOn=false;
  var ex=$('explode');
  var savedScroll=0;


  // build shelf, groups, cups
  var shelf=document.createElement('div'); shelf.className='shelf'; track.appendChild(shelf);
  var groups=[]; 
  ['Cloud Series','Pudding Series','Latte'].forEach(function(g){
    var el=document.createElement('div'); el.className='group'; el.textContent=g; track.appendChild(el);
    var idx=[]; DRINKS.forEach(function(d,i){ if(d.series===g) idx.push(i); });
    groups.push({el:el,idx:idx});
  });
  DRINKS.forEach(function(d,i){
    var b=document.createElement('button');
    b.type='button'; b.className='cup'; b.style.width=d.w+'px'; b.style.height=d.h+'px';
    b.setAttribute('aria-label',d.name);
    b.innerHTML='<span class="shadow"></span><img alt="" src="'+IMG[d.id]+'" draggable="false">';
    d.el=b; track.appendChild(b);
    b.addEventListener('pointerenter',function(e){ if(e.pointerType==='mouse' && sel<0){hov=i;layout();caption();} });
    b.addEventListener('pointerleave',function(e){ if(e.pointerType==='mouse' && sel<0){hov=-1;layout();caption();} });
    b.addEventListener('focus',function(){ if(sel<0){hov=i;layout();caption();} });
    b.addEventListener('blur',function(){ if(sel<0){hov=-1;layout();caption();} });
    b.addEventListener('click',function(){ if(swiped) return; open(i); });
  });

  // section tabs
  var tabsEl=$('tabs');
  TABS.forEach(function(v){
    var p=document.createElement('button'); p.type='button'; p.className='pill'; p.textContent=v[1];
    p.setAttribute('aria-pressed', v[0]===tab?'true':'false'); p.setAttribute('data-tab',v[0]);
    p.addEventListener('click',function(){ setTab(v[0]); });
    tabsEl.appendChild(p);
  });
  function computeVis(){
    vis=[]; pos=DRINKS.map(function(){return -1;});
    DRINKS.forEach(function(d,i){ if(tab==='all'||d.series===tab){ pos[i]=vis.length; vis.push(i); } });
  }
  function renderDots(){
    var dots=$('dots'); dots.innerHTML='';
    vis.forEach(function(i){
      var b=document.createElement('button'); b.type='button'; b.className='dot';
      b.setAttribute('aria-label',DRINKS[i].name); b.setAttribute('data-i',i);
      b.addEventListener('click',function(){ go(i); });
      dots.appendChild(b);
    });
  }
  function setTab(t){
    tab=t; computeVis(); renderDots();
    Array.prototype.forEach.call(tabsEl.children,function(p){ p.setAttribute('aria-pressed', p.getAttribute('data-tab')===tab?'true':'false'); });
    if(sel>=0 && pos[sel]<0){ sel=vis[0]; exKey=''; setHash(DRINKS[sel].id); }
    hov=-1; if(sel<0) stage.scrollLeft=0;
    renderFocus(); layout(); caption();
  }
  computeVis(); renderDots();

  // view pills
  var pills=$('pills');
  [['Photo','photo'],['Pixel','pixel'],['Exploded','explode']].forEach(function(v){
    var p=document.createElement('button'); p.type='button'; p.className='pill'; p.textContent=v[0];
    p.setAttribute('aria-pressed', v[1]===view?'true':'false');
    p.addEventListener('click',function(){ view=v[1]; renderFocus(); layout(); });
    pills.appendChild(p);
  });
  function caption(){
    if(hov>=0){
      var d=DRINKS[hov];
      $('capName').textContent=d.name;
      $('capSub').textContent=d.series;
    } else {
      $('capName').textContent=vis.length+(vis.length===1?' drink':' drinks');
      $('capSub').textContent=(stage.clientWidth<700?'Swipe sideways, tap a cup to open':'Hover a cup, click to open');
    }
  }
  function renderFocus(){
    if(sel<0) return;
    var d=DRINKS[sel];
    $('fSeries').textContent=d.series;
    $('fTitle').textContent=d.name;
    $('fDesc').textContent=d.d;
    var ch=$('fChips'); ch.innerHTML='';
    d.L.forEach(function(l){ var s=document.createElement('span'); s.className='chip'; s.textContent=l[0]; ch.appendChild(s); });
    Array.prototype.forEach.call($('dots').children,function(b){ b.setAttribute('aria-current', Number(b.getAttribute('data-i'))===sel?'true':'false'); });
    Array.prototype.forEach.call(pills.children,function(p,j){ p.setAttribute('aria-pressed', ['photo','pixel','explode'][j]===view?'true':'false'); });
  }

  function layout(){
    var W=stage.clientWidth, H=stage.clientHeight;
    if(!W||!H) return;
    var m=vis.length||1;
    var maxW=0,maxH=0; DRINKS.forEach(function(d){maxW=Math.max(maxW,d.w);maxH=Math.max(maxH,d.h);});
    var focusMode = sel>=0, nar=W<700;
    var base=focusMode?H*(nar?0.80:0.84):H*(nar?0.60:0.84);
    var slot=Math.max(W/m,150);
    var trackW=focusMode?W:Math.max(W,slot*m);
    var off=trackW>slot*m?(trackW-slot*m)/2:0;
    track.style.width=trackW+'px';
    var k=Math.min(slot*0.88/maxW, base/(maxH*1.5), m<=4?0.95:0.78);
    var hs=1.42;
    shelf.style.top=base+'px';
    groups.forEach(function(g){
      var show = tab==='all' && !focusMode;
      g.el.style.display = show?'block':'none';
      var a=pos[g.idx[0]], b=pos[g.idx[g.idx.length-1]];
      g.el.style.top=(base+22)+'px';
      g.el.style.left=(off+slot*((a+b+1)/2))+'px';
    });
    var push=(hs-1)*maxW*k*0.42;
    var hp=hov>=0?pos[hov]:-1, sp=sel>=0?pos[sel]:-1;
    DRINKS.forEach(function(d,i){
      var p=pos[i], x,s,op=1,blur=0,z=1,ev='auto';
      if(p<0){
        x=W/2; s=k*0.6; op=0; ev='none';
      } else if(!focusMode){
        x=off+slot*(p+0.5);
        s=k;
        if(hp>=0){
          if(p<hp) x-=push; else if(p>hp) x+=push; else { s=k*hs; z=5; }
        }
      } else {
        var dd=p-sp, ad=Math.abs(dd), sg=dd<0?-1:1;
        var ks=Math.min((H*0.70)/d.h, (W*0.7)/d.w, 2.3);
        if(ad===0){ x=W/2; s=ks; z=10; }
        else {
          var selHalf=ks*DRINKS[sel].w/2*0.85;
          x=W/2+sg*(selHalf+(nar?0.14:0.09)*W+k*d.w/2+(ad-1)*(nar?0.3:0.15)*W);
          s=Math.min(k*1.05, 0.9)*(ad>1?0.9:1);
          blur=ad===1?5:8;
          op = nar ? (ad===1?0.55:0) : (ad===1?0.6:ad===2?0.3:0);
          z=5-ad; ev = op>0?'auto':'none';
        }
      }
      if(focusMode&&view!=='pixel'){ op=0; ev='none'; }
      var tx=x-d.w/2, ty=base-d.h;
      d.el.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+s.toFixed(3)+')';
      d.el.style.opacity=op;
      d.el.style.filter=blur?'blur('+blur+'px)':'none';
      d.el.style.zIndex=z;
      d.el.style.pointerEvents=ev;
      d.el.tabIndex = (p<0 || (focusMode && i!==sel)) ? -1 : 0;
      d.el.setAttribute('aria-hidden', p<0?'true':'false');
    });
    var wc=sel>=0?DRINKS[sel]:(hov>=0?DRINKS[hov]:null);
    app.style.setProperty('--wash', wc?WASH[wc.id]:'#ECEDE8');
    buildExplode(W,H);
    placePhoto(W,H,base);
  }

  function placePhoto(W,H,base){
    var pv=$('photoView'), img=$('photoImg');
    var on = sel>=0 && view==='photo';
    pv.classList.toggle('on',on);
    if(!on) return;
    var d=DRINKS[sel], sz=PHS[d.id];
    var narrow=W<700;
    var h=Math.min(H*(narrow?0.74:0.84), sz[1]*(narrow?1.9:1.55), (W*0.92)*sz[1]/sz[0]);
    var w=h*sz[0]/sz[1];
    if(img.getAttribute('data-id')!==d.id){ img.src=PH[d.id]; img.setAttribute('data-id',d.id); }
    img.style.width=w+'px'; img.style.height=h+'px';
    img.style.left=(W/2-w/2)+'px'; img.style.top=(base-h)+'px';
    var sh=pv.querySelector('.pshadow');
    sh.style.width=(w*0.8)+'px'; sh.style.left=(W/2-w*0.4)+'px'; sh.style.top=(base-6)+'px';
  }

  function buildExplode(W,H){
    var on = sel>=0 && view==='explode';
    var key = on ? [sel,W,H].join('x') : '';
    if(key===exKey) return;
    exKey=key; ex.innerHTML='';
    if(!on) return;
    var d=DRINKS[sel], narrow=W<700, gap=narrow?14:24, nL=d.L.length;
    var avail=H*0.94-(nL-1)*gap;
    var s=Math.min(avail/d.h,(W*(narrow?0.48:0.4))/d.w,2.2);
    var cw=d.w*s, ch=d.h*s, total=ch+(nL-1)*gap;
    var cx=narrow?W*0.3:W*0.38, top0=(H-total)/2, left=cx-cw/2;
    var parts=[];
    d.L.forEach(function(l,j){
      var y0=l[1]*ch, y1=l[2]*ch;
      var sl=document.createElement('div'); sl.className='slice';
      sl.style.cssText='left:'+left+'px;top:'+(top0+y0)+'px;width:'+cw+'px;height:'+(y1-y0+0.5)+'px';
      sl.innerHTML='<img alt="" src="'+IMG[d.id]+'" style="top:'+(-y0)+'px;width:'+cw+'px;height:'+ch+'px">';
      var lb=document.createElement('div'); lb.className='elabel'; lb.textContent=l[0];
      var lx=left+cw+(narrow?40:56);
      lb.style.cssText='left:'+lx+'px;top:'+(top0+(y0+y1)/2-7)+'px;max-width:'+Math.max(80,W-lx-10)+'px;opacity:0';
      ex.appendChild(sl); ex.appendChild(lb); parts.push([sl,lb,j]);
    });
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      parts.forEach(function(p){
        var y='translateY('+(p[2]*gap)+'px)';
        p[0].style.transform=y; p[1].style.transform=y; p[1].style.opacity=1;
      });
    });});
  }

  function setHash(id){ try{ if(location.hash!=='#'+id) location.hash=id; }catch(e){} }
  function open(i,quiet){
    if(sel<0) savedScroll=stage.scrollLeft;
    sel=i; hov=-1; exKey='';
    stage.classList.add('is-focus'); app.classList.add('is-focus-mode');
    stage.scrollLeft=0;
    if(!quiet) setHash(DRINKS[i].id);
    renderFocus(); layout();
  }
  function close(){
    if(sel<0) return;
    var was=sel; sel=-1; hov=-1;
    stage.classList.remove('is-focus'); app.classList.remove('is-focus-mode');
    try{ if(location.hash) location.hash=''; }catch(e){}
    layout(); stage.scrollLeft=savedScroll; caption();
    if(kbd){ try{ DRINKS[was].el.focus({preventScroll:true}); }catch(e){} }
  }
  function go(i){
    if(sel<0||i===sel) return;
    sel=i; setHash(DRINKS[i].id); renderFocus(); layout();
  }
  function step(dir){
    if(sel<0) return;
    var j=pos[sel]+dir; if(j<0||j>=vis.length) return;
    go(vis[j]);
  }
  function fromHash(){
    var h=(location.hash||'').slice(1);
    var i=DRINKS.findIndex(function(d){return d.id===h;});
    if(i>=0){
      if(i===sel) return;
      if(pos[i]<0) setTab('all');
      open(i,true);
    } else if(sel>=0 && !h){ close(); }
  }
  window.addEventListener('hashchange',fromHash);
  $('back').addEventListener('click',close);
  $('prev').addEventListener('click',function(){step(-1)});
  $('next').addEventListener('click',function(){step(1)});
  var kbd=false;
  document.addEventListener('pointerdown',function(){ kbd=false; },true);
  document.addEventListener('keydown',function(e){
    kbd=true;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft') step(-1);
    else if(e.key==='ArrowRight') step(1);
  });

  // swipe in focus view
  var sx=null, swiped=false;
  stage.addEventListener('pointerdown',function(e){ sx=e.clientX; swiped=false; });
  stage.addEventListener('pointerup',function(e){
    if(sx===null) return;
    var dx=e.clientX-sx; sx=null;
    if(sel>=0 && Math.abs(dx)>40){ swiped=true; step(dx<0?1:-1); setTimeout(function(){swiped=false},60); }
  });

  if(window.ResizeObserver){ new ResizeObserver(layout).observe(stage); }
  window.addEventListener('resize',layout);
  caption(); layout();
  fromHash();
  if(sel<0 && window.innerWidth<700){ open(vis[0],true); }
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(layout); }
})();
